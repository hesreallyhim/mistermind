name: MisterMind Remote Actions

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Room issue number"
        required: true
        type: number
      action:
        description: "Command to run against the room"
        required: true
        type: choice
        options:
          - guess
          - status
          - help
          - giveup
      guess:
        description: "Guess payload for action=guess (e.g. 'r b g y' or 'red blue green yellow')"
        required: false
        type: string
      apply_moderation:
        description: "Apply moderation lane before game command"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: mistermind-remote-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    if: >-
      (vars.MM_PAUSED_UNTIL == '' || vars.MM_PAUSED_UNTIL == '0') &&
      vars.MM_RATE_MODE != 'lockdown' &&
      vars.MM_RATE_MODE != 'secondary_lockdown'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve hot-path auth mode
        id: auth_mode
        env:
          MM_GH_AUTH_MODE: ${{ vars.MM_GH_AUTH_MODE }}
          MM_GH_APP_ID: ${{ vars.MISTERMIND_GH_APP_ID }}
          MM_GH_APP_PRIVATE_KEY: ${{ secrets.MISTERMIND_GH_APP_PRIVATE_KEY }}
        run: |
          if [ "${MM_GH_AUTH_MODE}" = "app" ] && [ -n "${MM_GH_APP_ID}" ] && [ "${MM_GH_APP_ID}" != "0" ] && [ -n "${MM_GH_APP_PRIVATE_KEY}" ]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        if: steps.auth_mode.outputs.use_app == 'true'
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MISTERMIND_GH_APP_ID }}
          private-key: ${{ secrets.MISTERMIND_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Select hot-path token
        id: hot_auth
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          PAT_TOKEN: ${{ secrets.MISTERMIND_GH_PAT }}
          DEFAULT_AUTOMATION_LOGIN: ${{ vars.MM_AUTOMATION_LOGIN }}
        run: |
          if [ -n "${APP_TOKEN}" ]; then
            echo "gh_token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
            if [ -n "${APP_SLUG}" ]; then
              echo "automation_login=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
            elif [ -n "${DEFAULT_AUTOMATION_LOGIN}" ]; then
              echo "automation_login=${DEFAULT_AUTOMATION_LOGIN}" >> "$GITHUB_OUTPUT"
            else
              echo "automation_login=github-actions[bot]" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "gh_token=${PAT_TOKEN}" >> "$GITHUB_OUTPUT"
            if [ -n "${DEFAULT_AUTOMATION_LOGIN}" ]; then
              echo "automation_login=${DEFAULT_AUTOMATION_LOGIN}" >> "$GITHUB_OUTPUT"
            else
              echo "automation_login=github-actions[bot]" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run remote action
        id: remote_run
        env:
          GH_TOKEN: ${{ steps.hot_auth.outputs.gh_token }}
          MISTERMIND_SALT: ${{ secrets.MISTERMIND_SALT }}
          MISTERMIND_STATE_SIGNING_SECRET: ${{ secrets.MISTERMIND_STATE_SIGNING_SECRET }}
          MM_MOD_POLICY_PATH: config/moderation-policy.v1.json
          MM_ENGINE_MODE: remote
          MM_AUTOMATION_LOGIN: ${{ steps.hot_auth.outputs.automation_login }}
          MM_PAUSED_UNTIL: ${{ vars.MM_PAUSED_UNTIL }}
          MM_RATE_MODE: ${{ vars.MM_RATE_MODE }}
          MM_REMOTE_ISSUE_NUMBER: ${{ inputs.issue_number }}
          MM_REMOTE_ACTION: ${{ inputs.action }}
          MM_REMOTE_GUESS: ${{ inputs.guess }}
          MM_REMOTE_APPLY_MODERATION: ${{ inputs.apply_moderation }}
          MM_TERMINAL_RECORD_PATH: ${{ runner.temp }}/mistermind-terminal-result.json
        run: |
          set +e
          rm -f "$MM_TERMINAL_RECORD_PATH"
          PYTHONPATH=src python3 -m mistermind
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Persist terminal game record
        if: always()
        env:
          MM_TERMINAL_RECORD_PATH: ${{ runner.temp }}/mistermind-terminal-result.json
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ ! -s "$MM_TERMINAL_RECORD_PATH" ]; then
            echo "No terminal game record emitted for this action."
            exit 0
          fi

          if ! git ls-remote --exit-code --heads origin game-boards >/dev/null 2>&1; then
            echo "Creating missing game-boards branch from current commit."
            git push origin "${GITHUB_SHA}:refs/heads/game-boards"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RECORD_PATH="data/games/${ISSUE_NUMBER}.json"
          TMP_DIR="${RUNNER_TEMP}/game-boards-worktree"

          attempt=1
          while [ "$attempt" -le 6 ]; do
            echo "Persisting terminal record (attempt ${attempt}/6)"
            git fetch origin game-boards
            git worktree remove --force "$TMP_DIR" >/dev/null 2>&1 || true
            git worktree add --detach "$TMP_DIR" origin/game-boards

            mkdir -p "$TMP_DIR/data/games"
            cp "$MM_TERMINAL_RECORD_PATH" "$TMP_DIR/$RECORD_PATH"

            (
              cd "$TMP_DIR"
              git add "$RECORD_PATH"
              if git diff --cached --quiet; then
                echo "Terminal record unchanged; nothing to commit."
                exit 0
              fi
              git commit -m "stats: record game ${ISSUE_NUMBER} (remote action)"
              git push origin HEAD:game-boards
            ) && {
              echo "Terminal game record pushed to game-boards."
              git worktree remove --force "$TMP_DIR" >/dev/null 2>&1 || true
              exit 0
            }

            echo "Push failed, retrying after brief backoff..."
            attempt=$((attempt + 1))
            sleep 2
          done

          echo "Failed to persist terminal game record after retries." >&2
          git worktree remove --force "$TMP_DIR" >/dev/null 2>&1 || true
          exit 1

      - name: Update rate limit state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MISTERMIND_GH_PAT }}
          RUN_STATUS: ${{ steps.remote_run.outputs.status }}
        run: |
          scripts/update_rate_controls.sh
