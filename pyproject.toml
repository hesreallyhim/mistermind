[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mistermind"
version = "0.1.0"
description = "GitHub-issue-based variation of the classic game Mastermind - all gameplay happens within the repo itself."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Really Him" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
]

[project.scripts]
mistermind-engine = "mistermind.engine:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mistermind"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["mistermind"]
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mistermind = [
  "assets/*.svg",
  "config/*.json",
]
