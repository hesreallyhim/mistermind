<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" font-family="'SF Mono','Fira Code','Courier New',monospace">
  <defs>
    <linearGradient id="board-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1e33"/>
      <stop offset="40%" stop-color="#091828"/>
      <stop offset="100%" stop-color="#04101c"/>
    </linearGradient>
    <radialGradient id="peg-gloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="peg-shadow" x="-20%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
    <filter id="active-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="win-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="caustic-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="ocean-clip">
      <rect x="10" y="10" width="440" height="600" rx="18"/>
    </clipPath>
  </defs>

  <rect x="10" y="10" width="440" height="600" rx="18" fill="url(#board-bg)" stroke="#152540" stroke-width="3"/>

  <g clip-path="url(#ocean-clip)">
    <ellipse cx="130" cy="150" rx="70" ry="30" fill="#4fb7ee" opacity="0" filter="url(#caustic-blur)">
      <animate attributeName="opacity" values="0;0.17;0.07;0.2;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="130;185;115;175;130" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="330" cy="360" rx="90" ry="38" fill="#5bc8dc" opacity="0" filter="url(#caustic-blur)">
      <animate attributeName="opacity" values="0;0.14;0.05;0.16;0" dur="9s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="330;285;350;295;330" dur="12s" repeatCount="indefinite"/>
    </ellipse>

    <g opacity="0.16">
      <g transform="translate(-80 328)">
        <animateTransform attributeName="transform" type="translate" values="-80 328;540 308" dur="10.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -3;0 2;0 0" dur="3.2s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="14" ry="7.5" fill="#7cd0f8"/>
        <path d="M-12 0 L-24 -7 L-24 7 Z" fill="#7cd0f8">
          <animateTransform attributeName="transform" type="rotate" values="-12 -12 0;12 -12 0;-12 -12 0" dur="1.1s" repeatCount="indefinite"/>
        </path>
        <path d="M-1 -2 Q6 -8 11 -2 Q5 -3 -1 -2 Z" fill="#9be2ff" opacity="0.8"/>
        <circle cx="6" cy="-1.7" r="1.2" fill="#18344d"/>
      </g>

      <g transform="translate(540 392)">
        <animateTransform attributeName="transform" type="translate" values="540 392;-90 374" dur="9.1s" begin="2.7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 2;0 -2;0 0" dur="2.8s" begin="2.7s" repeatCount="indefinite"/>
        <g transform="scale(-1 1)">
          <ellipse cx="0" cy="0" rx="11" ry="6" fill="#74c6ef"/>
          <path d="M-9 0 L-18 -5 L-18 5 Z" fill="#74c6ef">
            <animateTransform attributeName="transform" type="rotate" values="-14 -9 0;14 -9 0;-14 -9 0" dur="0.95s" begin="2.7s" repeatCount="indefinite"/>
          </path>
          <path d="M0 -1 Q5 -6 9 -1 Q4 -2 0 -1 Z" fill="#97dcff" opacity="0.78"/>
          <circle cx="4.8" cy="-1.4" r="1" fill="#173042"/>
        </g>
      </g>
    </g>

    <circle cx="390" cy="550" r="5" fill="rgba(140,210,255,0.18)" stroke="rgba(170,230,255,0.38)" stroke-width="1">
      <animate attributeName="cy" from="550" to="30" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="390;405;386;402;390" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.8;1;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="590" r="4" fill="rgba(140,210,255,0.16)" stroke="rgba(170,230,255,0.32)" stroke-width="0.9">
      <animate attributeName="cy" from="590" to="45" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="75;88;70;86;75" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0.7;0.95;0" dur="11s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="235" cy="600" r="6" fill="rgba(140,210,255,0.15)" stroke="rgba(170,230,255,0.3)" stroke-width="1">
      <animate attributeName="cy" from="600" to="35" dur="14s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="235;248;228;244;235" dur="5.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.65;0.9;0" dur="14s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="10" y="10" width="440" height="50" rx="18" fill="#0f2038" opacity="0.94"/>
  <rect x="10" y="42" width="440" height="18" fill="#0a1a30" opacity="0.94"/>
  {{TITLE}}

  <text x="42" y="80" fill="#9ec4e0" font-size="10" font-weight="bold">#</text>
  <text x="155" y="80" fill="#9ec4e0" font-size="10" font-weight="bold" text-anchor="middle">GUESS</text>
  <text x="340" y="80" fill="#9ec4e0" font-size="10" font-weight="bold" text-anchor="middle">RESULT</text>

  {{ROW_01}}
  {{ROW_02}}
  {{ROW_03}}
  {{ROW_04}}
  {{ROW_05}}
  {{ROW_06}}
  {{ROW_07}}
  {{ROW_08}}
  {{ROW_09}}
  {{ROW_10}}

  {{PROGRESS}}

  <g transform="translate(0, 595)">
    <text x="230" y="10" text-anchor="middle" fill="#92bddc" font-size="9">C/L/#   &#x2713;/&#x2713; exact   &#x2713;/&#x2717; color-only   &#x2717;/&#x2717; absent</text>
  </g>

  {{OVERLAY}}
</svg>
