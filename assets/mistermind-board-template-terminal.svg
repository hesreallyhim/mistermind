<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" font-family="'SF Mono','Fira Code','Courier New',monospace">
  <defs>
    <linearGradient id="board-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f0a"/>
      <stop offset="100%" stop-color="#050805"/>
    </linearGradient>
    <radialGradient id="peg-gloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="peg-shadow" x="-20%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
    <filter id="active-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="win-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="460" height="3">
      <rect width="460" height="1.5" fill="transparent"/>
      <rect y="1.5" width="460" height="1.5" fill="rgba(0,0,0,0.15)"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="440" height="600" rx="18" fill="url(#board-bg)" stroke="#0f1a0f" stroke-width="3"/>
  <rect x="10" y="10" width="440" height="600" rx="18" fill="url(#scanlines)" opacity="0.25"/>

  <rect x="10" y="10" width="440" height="600" rx="18" fill="none" stroke="#00ff44" stroke-width="0.8" opacity="0.15">
    <animate attributeName="opacity" values="0.12;0.22;0.16;0.2;0.12" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <rect x="18" y="14" width="424" height="2" fill="#00ff44" opacity="0">
    <animate attributeName="y" values="14;606" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.18;0.08;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <rect x="10" y="10" width="440" height="50" rx="18" fill="#0c120c"/>
  <rect x="10" y="42" width="440" height="18" fill="#0c120c"/>
  <text x="20" y="28" fill="#39d872" font-size="10" opacity="0.6">user@mistermind:~$</text>
  {{TITLE}}

  <text x="42" y="80" fill="#39d872" font-size="10" font-weight="bold">#</text>
  <text x="155" y="80" fill="#39d872" font-size="10" font-weight="bold" text-anchor="middle">GUESS</text>
  <text x="340" y="80" fill="#39d872" font-size="10" font-weight="bold" text-anchor="middle">RESULT</text>

  {{ROW_01}}
  {{ROW_02}}
  {{ROW_03}}
  {{ROW_04}}
  {{ROW_05}}
  {{ROW_06}}
  {{ROW_07}}
  {{ROW_08}}
  {{ROW_09}}
  {{ROW_10}}

  {{PROGRESS}}

  <g transform="translate(0, 595)">
    <text x="230" y="10" text-anchor="middle" fill="#39d872" font-size="9">Color and position   Color only   Neither color nor position</text>
  </g>

  {{OVERLAY}}
</svg>
