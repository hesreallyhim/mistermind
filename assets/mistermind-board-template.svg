<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" font-family="'SF Mono','Fira Code','Courier New',monospace">
  <defs>
    <linearGradient id="board-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1f14"/>
      <stop offset="100%" stop-color="#1a120b"/>
    </linearGradient>
    <radialGradient id="peg-gloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="peg-shadow" x="-20%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
    <filter id="active-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="win-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Board body -->
  <rect x="10" y="10" width="440" height="600" rx="18" fill="url(#board-bg)" stroke="#3d2a1a" stroke-width="3"/>

  <!-- Title bar -->
  <rect x="10" y="10" width="440" height="50" rx="18" fill="#3d2a1a"/>
  <rect x="10" y="42" width="440" height="18" fill="#3d2a1a"/>
  {{TITLE}}

  <!-- Column headers -->
  <text x="42" y="80" fill="#d0ab7f" font-size="10" font-weight="bold">#</text>
  <text x="155" y="80" fill="#d0ab7f" font-size="10" font-weight="bold" text-anchor="middle">GUESS</text>
  <text x="340" y="80" fill="#d0ab7f" font-size="10" font-weight="bold" text-anchor="middle">RESULT</text>

  <!-- Rows -->
  {{ROW_01}}
  {{ROW_02}}
  {{ROW_03}}
  {{ROW_04}}
  {{ROW_05}}
  {{ROW_06}}
  {{ROW_07}}
  {{ROW_08}}
  {{ROW_09}}
  {{ROW_10}}

  <!-- Progress bar -->
  {{PROGRESS}}

  <!-- Legend -->
  <g transform="translate(0, 595)">
    <text x="230" y="10" text-anchor="middle" fill="#c7a074" font-size="9">Color and position   Color only   Neither color nor position</text>
  </g>

  <!-- Overlay (win/loss) — empty when active -->
  {{OVERLAY}}
</svg>
